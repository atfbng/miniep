<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="330" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">同一份保存权重，完成两行输入的投影</tspan></text><text font-size="14" text-anchor="start" fill="#627080"><tspan x="30" y="62">W 的每一行定义一个输出特征；转置视图把它变成逻辑乘法的一列。</tspan></text><rect x="20" y="110" width="200" height="120" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="120.0" y="139">输入 X [2,2]</tspan><tspan x="120.0" y="164">[1,2]</tspan><tspan x="120.0" y="189">[3,4]</tspan></text><rect x="280" y="110" width="200" height="120" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380.0" y="139">保存 W [3,2]</tspan><tspan x="380.0" y="164">[1,0]；[0,1]；[1,1]</tspan><tspan x="380.0" y="189">逻辑使用 Wᵀ [2,3]</tspan></text><rect x="540" y="110" width="200" height="120" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="640.0" y="139">输出 Y [2,3]</tspan><tspan x="640.0" y="164">[1,2,3]</tspan><tspan x="640.0" y="189">[3,4,7]</tspan></text><path d="M225,170 L275,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="14" text-anchor="middle" fill="#526174"><tspan x="250.0" y="161.0">×</tspan></text><path d="M485,170 L535,170" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="14" text-anchor="middle" fill="#526174"><tspan x="510.0" y="161.0">=</tspan></text><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="285">Y[0,2] = 1×1 + 2×1 = 3；Y[1,2] = 3×1 + 4×1 = 7</tspan></text></g></svg>