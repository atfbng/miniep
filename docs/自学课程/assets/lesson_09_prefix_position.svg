<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="330" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">原始记录 q=3 的输出位置，由三个偏移相加</tspan></text><text font-size="14" text-anchor="start" fill="#627080"><tspan x="30" y="62">示意块大小 B=2；实际 Kernel 使用 B=128，偏移关系相同。</tspan></text><rect x="20" y="110" width="210" height="110" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="125.0" y="139">Expert E2 的起点</tspan><tspan x="125.0" y="164">O₂ = 4</tspan><tspan x="125.0" y="189">先跳过 E0、E1</tspan></text><rect x="275" y="110" width="210" height="110" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380.0" y="139">此前块中的 E2 行数</tspan><tspan x="380.0" y="164">P[1,2] = 1</tspan><tspan x="380.0" y="189">跳过块 0 的一行 E2</tspan></text><rect x="530" y="110" width="210" height="110" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="635.0" y="139">本块此前的 E2 行数</tspan><tspan x="635.0" y="164">l(3) = 0</tspan><tspan x="635.0" y="189">块 1 的首条 E2</tspan></text><text font-size="25" text-anchor="middle" fill="#263445"><tspan x="250" y="175">+</tspan></text><text font-size="25" text-anchor="middle" fill="#263445"><tspan x="505" y="175">+</tspan></text><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="285">p(3) = 4 + 1 + 0 = 5；pack_index[5]=3，restore_index[3]=5</tspan></text></g></svg>