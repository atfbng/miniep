<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="410" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">17 行 Expert 输入，拆成一个完整 Tile 与一个尾 Tile</tspan></text><text font-size="14" text-anchor="start" fill="#627080"><tspan x="30" y="62">沿用 counts=[64,17,103,8]，BM=16；每个 M Tile 再遍历输出列片段。</tspan></text><rect x="25" y="105" width="300" height="120" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="175.0" y="134">E1 的输入段 [64:81]</tspan><tspan x="175.0" y="159">局部行 0～16</tspan><tspan x="175.0" y="184">offsets[1]=64，offsets[2]=81</tspan></text><rect x="435" y="95" width="300" height="95" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="585.0" y="124">Tile 0：局部行 0～15</tspan><tspan x="585.0" y="149">全局行 [64:80]，16 行有效</tspan></text><rect x="435" y="235" width="300" height="95" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="585.0" y="264">Tile 1：局部起点 16</tspan><tspan x="585.0" y="289">全局行 80 有效，其余 15 行 mask</tspan></text><path d="M330,145 L430,145" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M330,185 L430,280" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380" y="375">两个 Tile 读取 E1 的同一份权重，写入互不重叠的输出行。</tspan></text></g></svg>