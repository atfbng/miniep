<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="410" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">跟踪 T7 的 E0 分支：身份保持，行号变化</tspan></text><text font-size="14" text-anchor="start" fill="#627080"><tspan x="30" y="62">T7 是全局 Token 编号；记录 q 按来源 Rank 的本地 Token 编号展开。</tspan></text><rect x="25" y="90" width="215" height="105" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="132.5" y="119">来源 Rank 1</tspan><tspan x="132.5" y="144">本地 Token 3，slot 0</tspan><tspan x="132.5" y="169">原始记录 q=6</tspan></text><rect x="275" y="90" width="215" height="105" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="382.5" y="119">源端打包行 0</tspan><tspan x="382.5" y="144">E0 块内行 0</tspan><tspan x="382.5" y="169">发往 Rank 0</tspan></text><rect x="525" y="90" width="210" height="105" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="630.0" y="119">目标 Rank 0</tspan><tspan x="630.0" y="144">接收行 3</tspan><tspan x="630.0" y="169">E0 批次中的第 2 行</tspan></text><path d="M245,140 L270,140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,140 L520,140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="525" y="265" width="210" height="100" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="630.0" y="294">E0 计算后</tspan><tspan x="630.0" y="319">写回接收行 3</tspan><tspan x="630.0" y="344">返回来源 Rank 1</tspan></text><rect x="275" y="265" width="215" height="100" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="382.5" y="294">返回打包行 0</tspan><tspan x="382.5" y="319">restore_index[6]=0</tspan><tspan x="382.5" y="344">读取该分支结果</tspan></text><rect x="25" y="265" width="215" height="100" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="132.5" y="294">回到 T7 的输出</tspan><tspan x="132.5" y="319">乘该分支权重 0.5911</tspan><tspan x="132.5" y="344">与 E1 分支相加</tspan></text><path d="M630,200 L630,260" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M520,315 L495,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M270,315 L245,315" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/></g></svg>