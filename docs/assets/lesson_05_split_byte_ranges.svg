<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="375" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">同一块四行数据，在两端有不同的起点</tspan></text><rect x="30" y="105" width="300" height="145" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="180.0" y="134">来源 Rank 1：send [5,2]</tspan><tspan x="180.0" y="159">send_splits = [4,1]</tspan><tspan x="180.0" y="184">发往 Rank 0：行 [0:4]</tspan><tspan x="180.0" y="209">FP32 字节 [0:32]</tspan></text><rect x="430" y="105" width="300" height="145" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="580.0" y="134">目标 Rank 0：recv [7,2]</tspan><tspan x="580.0" y="159">recv_splits = [3,4]</tspan><tspan x="580.0" y="184">来自 Rank 1：行 [3:7]</tspan><tspan x="580.0" y="209">FP32 字节 [24:56]</tspan></text><path d="M335,175 L425,175" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="14" text-anchor="middle" fill="#526174"><tspan x="380.0" y="166.0">32 bytes</tspan></text><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="305">块内第 j 行：发送行 j → 接收行 3+j，j=0,1,2,3</tspan></text><text font-size="15" text-anchor="middle" fill="#627080"><tspan x="380" y="341">行数保持 4；起点由两端各自的 splits 前缀和确定。</tspan></text></g></svg>