<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="375" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">两个槽交替使用，epoch 区分每次写入</tspan></text><rect x="25" y="115" width="215" height="120" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="132.5" y="144">round=0</tspan><tspan x="132.5" y="169">slot=0，epoch=1</tspan><tspan x="132.5" y="194">消费后 consumed=1</tspan></text><rect x="275" y="115" width="215" height="120" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="382.5" y="144">round=1</tspan><tspan x="382.5" y="169">slot=1，epoch=2</tspan><tspan x="382.5" y="194">消费后 consumed=2</tspan></text><rect x="525" y="115" width="210" height="120" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="630.0" y="144">round=2</tspan><tspan x="630.0" y="169">复用 slot=0，epoch=3</tspan><tspan x="630.0" y="194">先等 consumed≥1</tspan></text><path d="M245,175 L270,175" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M495,175 L520,175" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="295">slot 决定写入哪份空间；epoch 决定等待哪一轮数据。</tspan></text><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380" y="335">ready：输入可读　done：结果可读　consumed：输入槽可覆盖</tspan></text></g></svg>