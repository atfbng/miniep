<svg xmlns="http://www.w3.org/2000/svg" width="760" height="385" viewBox="0 0 760 385"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="385" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">相同的两份输入，三种 Collective 的结果</tspan></text><text font-size="14" text-anchor="start" fill="#627080"><tspan x="30" y="62">输入为 [2] int64；All-to-All 每个目标取一项，接收端按来源拼接。</tspan></text><rect x="185" y="90" width="390" height="75" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380.0" y="119">Rank 0：[1,10]；Rank 1：[2,20]</tspan></text><rect x="20" y="235" width="220" height="110" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="130.0" y="264">AllReduce SUM</tspan><tspan x="130.0" y="289">两个 Rank 均得到</tspan><tspan x="130.0" y="314">[3,30]</tspan></text><rect x="270" y="235" width="220" height="110" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380.0" y="264">AllGather + stack</tspan><tspan x="380.0" y="289">两个 Rank 均得到</tspan><tspan x="380.0" y="314">[[1,10],[2,20]]</tspan></text><rect x="520" y="235" width="220" height="110" rx="10" fill="#eaf6ed" stroke="#397b4c" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="630.0" y="264">All-to-All</tspan><tspan x="630.0" y="289">Rank 0：[1,2]</tspan><tspan x="630.0" y="314">Rank 1：[10,20]</tspan></text><path d="M380,170 L130,230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,170 L380,230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M380,170 L630,230" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/></g></svg>