<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="370" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">来源分块与 Expert 分组之间，只有行位置发生变化</tspan></text><rect x="20" y="105" width="310" height="125" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="175.0" y="134">接收行顺序</tspan><tspan x="175.0" y="159">0  1  2 | 3  4  5  6  7</tspan><tspan x="175.0" y="184">E0 E0 E1 | E0 E1 E1 E1 E1</tspan><tspan x="175.0" y="209">来源 R0 | 来源 R1</tspan></text><rect x="430" y="105" width="310" height="125" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="585.0" y="134">Expert-major 收集顺序</tspan><tspan x="585.0" y="159">0  1  3 | 2  4  5  6  7</tspan><tspan x="585.0" y="184">E0：3 行 | E1：5 行</tspan><tspan x="585.0" y="209">origin 保存这些接收行号</tspan></text><path d="M335,165 L425,165" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="14" text-anchor="middle" fill="#526174"><tspan x="380.0" y="156.0">收集</tspan></text><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="295">Grouped MLP 后：computed[2] 属于接收行 origin[2]=3</tspan></text><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380" y="333">index_copy 写回 result[3]，返回 A2A 继续使用来源分块。</tspan></text></g></svg>