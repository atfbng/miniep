<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="760" height="340" rx="12" fill="white"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text font-size="21" text-anchor="start" fill="#263445"><tspan x="30" y="35">从原始记录找到打包行，再找到向量地址</tspan></text><rect x="20" y="105" width="200" height="100" rx="10" fill="#eaf3ff" stroke="#3274b9" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="120.0" y="134">原始记录 q=0</tspan><tspan x="120.0" y="159">Token 0，slot 0</tspan><tspan x="120.0" y="184">选择 E2</tspan></text><rect x="280" y="105" width="200" height="100" rx="10" fill="#f2ecfb" stroke="#8062ae" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="380.0" y="134">restore_index[0]=4</tspan><tspan x="380.0" y="159">打包行 p=4</tspan><tspan x="380.0" y="184">pack_index[4]=0</tspan></text><rect x="540" y="105" width="200" height="100" rx="10" fill="#fff2e2" stroke="#bd7623" stroke-width="1.7"/><text font-size="16" text-anchor="middle" fill="#263445"><tspan x="640.0" y="134">连续 packed[6,2]</tspan><tspan x="640.0" y="159">第 4 行从元素 8 开始</tspan><tspan x="640.0" y="184">FP32 字节偏移 32</tspan></text><path d="M225,155 L275,155" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M485,155 L535,155" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text font-size="17" text-anchor="middle" fill="#263445"><tspan x="380" y="265">E2 的输出 [3,6] × 权重 0.25 = 对 T0 的贡献 [0.75,1.5]</tspan></text><text font-size="15" text-anchor="middle" fill="#627080"><tspan x="380" y="305">restore_index 先找行，H 和 dtype 再确定这行的地址。</tspan></text></g></svg>