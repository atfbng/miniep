[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniep-course13"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["vllm==0.29.0"]

[project.entry-points."vllm.general_plugins"]
miniep_course13 = "mini_ep.integration.plugin:register"
miniep_course13_validation = "validation.plugin:register"

[tool.setuptools.packages.find]
include = ["mini_ep*", "reference*", "validation*"]
